<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Design Sprint · Docente</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#EAEEF7; --surface-3:#DFE5F1;
  --ink:#141E33; --ink-2:#4B566B; --ink-3:#7A8499; --line:#D5DCE9; --line-2:#C2CBDD;
  --azul:#1D3FA3; --azul-2:#3B63D6; --azul-soft:#E4EAFB; --azul-ink:#16327F;
  --rojo:#E63946; --rojo-soft:#FBE3E5; --rojo-ink:#A4222D;
  --ok:#2E8B57; --ok-soft:#E1F3E8; --warn:#9C6A12; --warn-soft:#FBF0D6; --bad:#C0392B; --bad-soft:#FBE3E0;
  --gold:#F5C400; --p-relato:#7B5EA7; --p-cifra:#D1642A; --p-fuente:#2C8C82; --p-cargo:#3E6FA8; --p-lugar:#4E8C4A; --p-norma:#B8453A;
  --shadow:0 10px 30px rgba(20,30,51,.10); --shadow-s:0 2px 8px rgba(20,30,51,.08);
  --f-disp:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:14px; --r-s:9px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0E1730; --surface:#16224A; --surface-2:#1C2A58; --surface-3:#243468; --ink:#EEF2FA; --ink-2:#BAC4DC; --ink-3:#8D98B5; --line:#2B3B70; --line-2:#3A4C86; --azul-soft:#1F2F66; --azul-ink:#B9C9FF; --rojo-soft:#4A1F2A; --rojo-ink:#FF9AA3; --ok-soft:#173A2A; --warn-soft:#3F3216; --warn:#F1C15B; --bad-soft:#4A2020; --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-s:0 2px 8px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0E1730; --surface:#16224A; --surface-2:#1C2A58; --surface-3:#243468; --ink:#EEF2FA; --ink-2:#BAC4DC; --ink-3:#8D98B5; --line:#2B3B70; --line-2:#3A4C86; --azul-soft:#1F2F66; --azul-ink:#B9C9FF; --rojo-soft:#4A1F2A; --rojo-ink:#FF9AA3; --ok-soft:#173A2A; --warn-soft:#3F3216; --warn:#F1C15B; --bad-soft:#4A2020; --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-s:0 2px 8px rgba(0,0,0,.3); color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azul-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
h1,h2,h3{font-family:var(--f-disp);line-height:1.15;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:28px;letter-spacing:-.2px} h2{font-size:21px} h3{font-size:16.5px}
p{margin:0}
a{color:var(--azul-2)}
.eyebrow{font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-2)} .tiny{font-size:13px} .small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ob{color:var(--azul-2);font-weight:700}

/* ---- capas ---- */
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 140px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-s)}
.card.soft{background:var(--surface-2);border-color:transparent;box-shadow:none}
.card.hero{border:0;box-shadow:var(--shadow)}
.paper2{background:var(--surface-2);border-radius:var(--r-s);padding:12px}
.divider{border:0;border-top:1px solid var(--line);margin:4px 0}

/* ---- cabecera pegada (alumno) ---- */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px 8px}
.top-row{display:flex;align-items:center;gap:8px}
.top-row .btn.small.rojo{min-height:32px;padding:5px 9px;font-size:12px}
.top-row .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.top-row .who canvas{border-radius:10px;flex:none}
.top-row .who b{display:block;font-family:var(--f-disp);font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-row .who small{display:block;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:22px;line-height:1;padding:7px 10px;border-radius:var(--r-s);background:var(--surface);border:1px solid var(--line);min-width:84px;text-align:center}
.clock small{display:block;font-family:var(--f-body);font-size:9.5px;letter-spacing:1px;color:var(--ink-3);margin-top:3px}
.clock.warn{color:var(--warn);border-color:var(--warn)} .clock.over{color:var(--rojo);border-color:var(--rojo)} .clock.paused{color:var(--ink-3)}
.prog{display:flex;gap:6px;margin-top:9px}
.prog button{flex:1;height:30px;border:0;border-radius:8px;background:var(--surface-3);color:var(--ink-3);font-size:12.5px;font-weight:700;font-family:var(--f-disp);padding:0;position:relative}
.prog button.open{background:var(--azul-soft);color:var(--azul-ink)}
.prog button.done{background:var(--ok-soft);color:var(--ok)}
.prog button.cur{outline:2px solid var(--azul-2);outline-offset:1px}
.prog button.locked{opacity:.55;cursor:default}
.prog button.now::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--rojo)}
@media (max-width:420px){.prog button{font-size:11px;height:26px}}

/* ---- bloque ---- */
.block-h{display:flex;gap:12px;align-items:flex-start;margin:16px 0 12px}
.block-h .num{font-family:var(--f-disp);font-weight:800;font-size:13px;letter-spacing:1px;color:var(--rojo);text-transform:uppercase}
.block-h h1{font-size:26px}
.block-h p{color:var(--ink-2);margin-top:2px}
.beau{display:flex;gap:10px;align-items:flex-start;background:var(--azul-soft);border-radius:var(--r);padding:10px 12px;color:var(--ink)}
.beau canvas{border-radius:10px;flex:none}
.beau .who{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--azul-2);font-weight:800;margin-bottom:2px}
.beau p{font-size:15px}
.steps{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}
.steps button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.steps button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps button.ok{border-color:var(--ok);color:var(--ok)}
.steps button.on.ok{background:var(--ok);color:#fff}
.steps button[disabled]{opacity:.5;cursor:default}

/* ---- botones ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-s);padding:11px 16px;font-weight:700;font-family:var(--f-disp);background:var(--azul);color:#fff;line-height:1.1;min-height:44px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:hover{background:var(--azul-2)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-2);box-shadow:none}
.btn.sec:hover{background:var(--surface-2)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.rojo{background:var(--rojo)} .btn.rojo:hover{background:#c92f3b}
.btn.ok{background:var(--ok)}
.btn.small{padding:7px 12px;min-height:34px;font-size:13.5px}
.btn.big{font-size:17px;min-height:52px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;line-height:1.2;min-height:36px;text-align:left}
.chip:hover{border-color:var(--azul-2)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.small{padding:5px 10px;min-height:30px;font-size:13px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-s);padding:11px 13px;line-height:1.3}
.opt:hover{border-color:var(--azul-2)}
.opt.on{border-color:var(--azul);background:var(--azul-soft);box-shadow:inset 4px 0 0 var(--rojo)}
.opt b{display:block;font-family:var(--f-disp)} .opt small{color:var(--ink-2);display:block;margin-top:2px}
.opt.dash{border-style:dashed}

/* ---- inputs ---- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.in{width:100%;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-s);padding:10px 12px;font-size:16px;min-height:44px}
.in:focus{border-color:var(--azul-2);outline:none;box-shadow:0 0 0 3px rgba(59,99,214,.18)}
.in.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
select.in{appearance:auto}
.hint{font-size:13px;color:var(--ink-3)}

/* ---- avisos ---- */
.box{border-radius:var(--r-s);padding:10px 12px;font-size:14.5px;border:1px solid transparent}
.box.ok{background:var(--ok-soft);color:var(--ink);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.box.warn{background:var(--warn-soft);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.box.bad{background:var(--bad-soft);color:var(--ink);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.box.info{background:var(--azul-soft);color:var(--ink)}
.st{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.3px;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)} .st.gap{background:var(--azul-soft);color:var(--azul-ink)}

/* ---- personajes ---- */
.npc{display:flex;gap:12px;align-items:flex-start}
.npc canvas{border-radius:12px;flex:none}
.npc .say{flex:1;min-width:0;background:var(--surface-2);border-radius:var(--r);padding:10px 14px;position:relative}
.npc .say .who{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:800;margin-bottom:3px}
.npc .say p{font-size:15.5px}
.npc .fic{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.frags{display:flex;flex-direction:column;gap:6px}
.frag{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:10px 12px;line-height:1.35;color:var(--ink);position:relative}
.frag:hover{border-color:var(--azul-2)}
.frag .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#fff;border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:middle}
.frag.t-dolor{border-color:var(--rojo)} .frag.t-quien{border-color:var(--p-cargo)} .frag.t-pierde{border-color:var(--p-lugar)}
.tagbtn{border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700}
.tagbtn.dolor.on{background:var(--rojo);border-color:var(--rojo);color:#fff} .tagbtn.quien.on{background:var(--p-cargo);border-color:var(--p-cargo);color:#fff} .tagbtn.pierde.on{background:var(--p-lugar);border-color:var(--p-lugar);color:#fff}
.tagbtn.done::after{content:" ✓"}
.expert{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;color:var(--ink)}
.expert:hover{border-color:var(--azul-2)}
.expert canvas{border-radius:10px;flex:none}
.expert b{display:block;font-family:var(--f-disp);font-size:15px} .expert small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.3} .expert small.muted{color:var(--ink-3)}
.expert.done{border-color:var(--ok);background:var(--ok-soft)}

/* ---- enemigos ---- */
.enemy{display:flex;gap:12px;align-items:flex-start;background:#1A1F2E;color:#F2F4F8;border-radius:var(--r);padding:14px;box-shadow:var(--shadow);animation:appear .35s ease-out}
.enemy .art{flex:none;width:84px;height:84px}
.enemy .name{font-family:var(--f-disp);font-weight:800;font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:#FFD978}
.enemy .say{font-style:italic;font-size:16px;margin:4px 0 8px;color:#F2F4F8}
.enemy .acts{display:flex;flex-direction:column;gap:8px}
.enemy .acts .field label{color:#C9D0E0}
.enemy .in{background:#0F1320;color:#F2F4F8;border-color:#3A4260}
.enemy .btn.sec{background:#2A3148;color:#F2F4F8;border-color:#3A4260}
.enemy .tiny{color:#C9D0E0}
.enemy.dissolve{animation:dissolve .6s ease-in forwards}
@keyframes appear{from{opacity:0;transform:translateY(8px)}}
@keyframes dissolve{to{opacity:0;transform:scale(.96)}}

/* ---- listas y piezas ---- */
.item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.item .tx{flex:1;min-width:0;font-size:15px}
.item .mv{border:0;background:var(--surface-2);color:var(--ink-2);border-radius:6px;width:30px;height:30px;font-size:14px;flex:none}
.item.fog{opacity:.75;border-style:dashed}
.pc{display:flex;align-items:center;gap:9px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:7px 10px;color:var(--ink);max-width:100%}
.pc:hover{border-color:var(--azul-2)}
.pc.sel{border-color:var(--azul);background:var(--azul-soft)}
.pc.used{opacity:.6}
.pc .k{width:26px;height:26px;border-radius:7px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:700;font-size:12px;flex:none}
.k.relato{background:var(--p-relato)} .k.cifra{background:var(--p-cifra)} .k.fuente{background:var(--p-fuente)} .k.cargo{background:var(--p-cargo)} .k.lugar{background:var(--p-lugar)} .k.norma{background:var(--p-norma)}
.pc .ty{display:block;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.pc .tx{display:block;font-size:14px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc.gap{border-style:dashed}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tray .pc{max-width:min(100%,320px)}
.frase{display:grid;gap:8px}
.frase .slot{border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;background:var(--surface)}
.frase .lb{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.frase .tx{font-size:15px;margin-top:3px} .frase .tx.empty{color:var(--ink-3);font-style:italic}
.nomen{font-family:var(--f-disp);font-size:16.5px;line-height:1.4;padding:12px 14px;border-left:4px solid var(--rojo);background:var(--surface-2);border-radius:0 var(--r-s) var(--r-s) 0}
.est{background:var(--warn-soft);border:1px dashed var(--warn);border-radius:var(--r-s);padding:10px 12px;font-size:14px}
.est b{display:block;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--warn);margin-bottom:3px}
.role{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface)}
.role .def{font-size:13px;color:var(--ink-2);margin:2px 0 8px}
.mold{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-s);padding:9px 11px;line-height:1.25}
.mold b{display:block;font-family:var(--f-disp);font-size:14px} .mold small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.mold.on{border-color:var(--azul);background:var(--azul-soft)} .mold.done{border-color:var(--ok)}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-s);padding:9px 11px;background:var(--surface-2)}
.q .tag{flex:none;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);margin-top:2px}
.q.win .tag{background:var(--ok-soft);color:var(--ok)} .q.junk .tag{background:var(--rojo-soft);color:var(--rojo-ink)}
.q .resp{font-style:italic;color:var(--ink-2);margin-top:2px}
.vered{font-family:var(--f-disp);font-size:24px;font-weight:800;color:var(--azul-2)}
.avatars{display:flex;gap:8px;flex-wrap:wrap}
.avatars button{border:2px solid transparent;background:var(--surface-2);border-radius:14px;padding:4px;line-height:0}
.avatars button.on{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(230,57,70,.22)}
.avatars canvas{border-radius:10px;display:block}
.ficha{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:18px;border:1px solid var(--line)}
.ficha h3{margin-top:14px;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--azul-2);font-size:13px;letter-spacing:1px;text-transform:uppercase}
.ficha ul{margin:6px 0 0 18px;padding:0} .ficha li{margin:3px 0}
.ficha .pend{display:inline-block;background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:13px;margin:2px 2px 2px 0}
.ficha .q{display:block}
.ficha .gapmark{font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 7px;margin-left:4px}

/* ---- Beau flotante ---- */
#beau{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:flex-end;gap:8px;pointer-events:none;max-width:740px;margin:0 auto}
#beau>*{pointer-events:auto}
#beau .bav{width:52px;height:60px;flex:none;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;background:#1D3FA3}
#beau .bav canvas{display:block}
#beau .bub{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:14px;line-height:1.4;box-shadow:var(--shadow);max-height:26vh;overflow:auto;flex:1}
#beau .bub .who{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--azul-2);font-weight:800;display:flex;justify-content:space-between;gap:8px}
#beau .bub .who button{border:0;background:none;color:var(--ink-3);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:0 2px;cursor:pointer}
#beau .bub .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#beau.min .bub{display:none}
#beau.min .bav{width:44px;height:50px;opacity:.9}
.toast{position:fixed;left:50%;top:calc(104px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-10px);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;z-index:120;max-width:min(92vw,520px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:110;display:flex;align-items:center;justify-content:center;padding:14px}
#modal .mbox{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
#modal .mbox.dark{background:#1A1F2E;color:#F2F4F8}
.waiting{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:24px 10px}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--rojo);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(230,57,70,.12)}}
.demo-bar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:70}
.demo-bar .panel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);width:min(92vw,330px);display:flex;flex-direction:column;gap:8px;margin-top:6px}
.tag-via{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;border-radius:999px;padding:2px 9px}
.tag-via.pivoteo{background:var(--rojo-soft);color:var(--rojo-ink)} .tag-via.definido{background:var(--azul-soft);color:var(--azul-ink)}

/* ---- docente ---- */
.tapp{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.tgrid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:920px){.tgrid{grid-template-columns:380px 1fr;align-items:start}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.brand canvas{border-radius:12px}
.brand h1{font-size:24px} .brand small{color:var(--ink-2)}
.blocks{display:flex;flex-direction:column;gap:6px}
.blk{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface)}
.blk .n{width:26px;height:26px;border-radius:8px;background:var(--surface-3);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--f-disp);font-size:13px;flex:none}
.blk .t{flex:1;min-width:0} .blk .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .blk .t small{display:block;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .t small b.mono{display:inline;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.blk .cnt{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);min-width:34px;text-align:right}
.blk.cur{border-color:var(--azul);background:var(--azul-soft)} .blk.cur .n{background:var(--azul);color:#fff}
.blk.past .n{background:var(--ok-soft);color:var(--ok)}
.bigclock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:44px;line-height:1;text-align:center;padding:12px;border-radius:var(--r);background:var(--surface-2)}
.bigclock.warn{color:var(--warn)} .bigclock.over{color:var(--rojo)} .bigclock.paused{color:var(--ink-3)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.stu{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.stu canvas{border-radius:9px;flex:none}
.stu .t{flex:1;min-width:0} .stu .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu .t small{display:block;color:var(--ink-2);font-size:12px}
.stu .dots{display:flex;gap:3px;margin-top:3px}
.stu .dots i{width:9px;height:9px;border-radius:2px;background:var(--surface-3);display:block}
.stu .dots i.d{background:var(--ok)} .stu .dots i.c{background:var(--azul-2)}
.stu .on{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none} .stu .on.off{background:var(--line-2)}
.stu.behind{border-color:var(--warn)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat div{background:var(--surface-2);border-radius:var(--r-s);padding:9px 10px} .stat b{display:block;font-size:22px;font-family:var(--f-disp)} .stat small{color:var(--ink-2);font-size:12px}
.qr{display:flex;gap:14px;flex-wrap:wrap} .qr>div{flex:1;min-width:200px;text-align:center} .qr svg{width:150px;height:150px;background:#fff;border-radius:10px;padding:6px} .qr .url{font-family:var(--f-mono);font-size:11.5px;word-break:break-all;color:var(--ink-2);margin-top:6px}
@media print{ #top,#beau,.toast,#modal,.noprint,.demo-bar,.prog{display:none!important} .app{padding:0;max-width:none} body{background:#fff;color:#000} .ficha{border:0} }

/* ---- fondo vivo (se mueve despacio; se detiene con reduced-motion) ---- */
canvas#bgfx{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none;background:var(--bg)}
/* ---- logo ---- */
.logo{display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:5px 10px;line-height:0;box-shadow:var(--shadow-s)}
.logo img{height:26px;width:auto;display:block}
.logo.big img{height:36px}
.top-row .logo{padding:3px 7px} .top-row .logo img{height:20px}
/* ---- llegada por pasos ---- */
.wiz{display:flex;gap:6px;align-items:center;margin:4px 0 10px}
.wiz i{flex:1;height:6px;border-radius:3px;background:var(--surface-3)} .wiz i.on{background:var(--azul)} .wiz i.done{background:var(--ok)}
.wiz-h{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.opt.num{display:flex;gap:10px;align-items:flex-start} .opt.num .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:800;font-size:13px} .opt.num.on .n{background:var(--azul);color:#fff} .opt.num b{font-weight:600;font-family:var(--f-body);font-size:15px}
.big-name{font-size:20px;min-height:52px}
/* ---- reloj destacado y listo ---- */
.clock.ping{animation:ping .9s ease-in-out 3}
@keyframes ping{50%{box-shadow:0 0 0 6px rgba(230,57,70,.25);transform:scale(1.04)}}
.clock.done{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.timechip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2);font-weight:700}
.timechip b{font-family:var(--f-mono);color:var(--ink)}
/* ---- árbol de causas y efectos ---- */
.tree{position:relative;overflow:hidden;padding:0}
.tree .tree-bg{position:absolute;inset:0;z-index:0;opacity:.7;pointer-events:none}
.tree .tree-bg svg{width:100%;height:100%;display:block}
.tree .tree-bg .roots path{fill:none;stroke:#8C6B47;stroke-width:7;stroke-linecap:round}
.tree .tree-bg.img{background-size:cover;background-position:center;opacity:.5}
.tree .tree-in{position:relative;z-index:1;display:grid;gap:12px;padding:16px;min-height:520px;align-content:space-between}
.tree .canopy{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;min-height:84px}
.tree .leaf{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ink);border-radius:999px 999px 999px 4px;padding:6px 11px;font-size:14px;max-width:100%;box-shadow:var(--shadow-s)}
.tree .root{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid #B58A5A;color:var(--ink);border-radius:4px 999px 999px 999px;padding:6px 11px;font-size:14px;max-width:100%;box-shadow:var(--shadow-s);cursor:pointer}
.tree .root.main{background:#E63946;border-color:#E63946;color:#fff;font-weight:700}
.tree .roots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-start;min-height:84px}
.tree .dolor{text-align:center;font-family:var(--f-disp);font-weight:700;font-size:15px;padding:8px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-s);margin:0 auto;max-width:520px;box-shadow:var(--shadow-s)}
.tree .dolor small{display:block;font-family:var(--f-body);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);font-weight:800;margin-bottom:2px}
.tree .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 80%,transparent);border-radius:8px;padding:4px 8px}
.tree .lbl h3{font-size:15px} .tree .lbl small{color:var(--ink-2);font-size:12.5px}
.tree .pesa{background:color-mix(in srgb,var(--surface) 88%,transparent)}
.tree .row .in{background:var(--surface)}
.tree .mini{border:0;background:transparent;color:inherit;opacity:.7;font-size:12px;padding:0 2px;cursor:pointer}
.tree .mini:hover{opacity:1}
.tree details.more{background:color-mix(in srgb,var(--surface) 88%,transparent)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .tree .root{background:#3D2E1E;color:#F1E4D0} }
:root[data-theme="dark"] .tree .root{background:#3D2E1E;color:#F1E4D0}
.pesa{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border-radius:var(--r-s);padding:8px 10px}
.pesa .q{background:transparent;padding:0;font-size:13.5px;color:var(--ink-2)}
/* ---- lluvia de preguntas ---- */
.qcard{border:1.5px solid var(--line);border-radius:var(--r-s);padding:9px 11px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.qcard.win{border-color:color-mix(in srgb,var(--ok) 45%,transparent)} .qcard.junk{border-color:color-mix(in srgb,var(--rojo) 35%,transparent);opacity:.85}
.qcard .star{flex:none;width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font-size:18px;line-height:1;cursor:pointer}
.qcard .star.on{background:var(--gold,#F5C400);border-color:var(--gold,#F5C400)}
.qcard .star[disabled]{opacity:.35;cursor:default}
.qcard .txt{flex:1;min-width:0;font-size:14.5px} .qcard .resp{font-style:italic;color:var(--ink-2);font-size:13.5px;margin-top:3px}
.qcard .tag{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);margin-right:6px}
.qcard.win .tag{background:var(--ok-soft);color:var(--ok)} .qcard.junk .tag{background:var(--rojo-soft);color:var(--rojo-ink)}
.counter{display:inline-flex;align-items:center;gap:6px;background:var(--azul-soft);color:var(--azul-ink);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px}
/* ---- cierre de bloque ---- */
.closebar{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.closebar .btn.big{width:100%}
.closebar .why{font-size:13px;color:var(--ink-3);text-align:center}
.done-note{display:flex;gap:10px;align-items:center;background:var(--ok-soft);border-radius:var(--r-s);padding:10px 12px;color:var(--ink)}
.done-note .ok-dot{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
details.more{border:1px solid var(--line);border-radius:var(--r-s);padding:8px 12px;background:var(--surface)}
details.more summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--azul-2)}
details.more ul{margin:6px 0 0 16px;padding:0;font-size:14px}
/* ---- docente: grupos y tiempos ---- */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.grp{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:8px 10px}
.grp h4{margin:0 0 6px;font-family:var(--f-disp);font-size:13px;display:flex;justify-content:space-between} .grp h4 span{color:var(--ink-3);font-weight:600}
.grp .nm{font-size:13px;padding:3px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:6px} .grp .nm small{color:var(--ink-3);font-family:var(--f-mono)}
.grp.cur{border-color:var(--azul)}
.allready{background:var(--ok-soft);border:1.5px solid var(--ok);border-radius:var(--r-s);padding:10px 12px;font-weight:700;color:var(--ink)}
.demo-hint{display:flex;gap:10px;align-items:flex-start;background:var(--rojo-soft);border:1.5px dashed var(--rojo);border-radius:var(--r-s);padding:10px 12px;font-size:14px;color:var(--ink)}
.demo-hint b{color:var(--rojo-ink)}
/* ---- selector de rol (demo combinada) ---- */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.role-card{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;color:var(--ink);box-shadow:var(--shadow-s)}
.role-card:hover{border-color:var(--azul-2)} .role-card b{font-family:var(--f-disp);font-size:18px} .role-card small{color:var(--ink-2);font-size:13.5px}
.rolebar{position:fixed;left:0;right:0;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:6px 12px;background:#141E33;color:#fff;font-size:13px}
.rolebar .btn{min-height:30px;padding:4px 10px;font-size:12.5px}
.roleframe{position:fixed;left:0;right:0;top:42px;bottom:0;width:100%;height:calc(100% - 42px);border:0;background:var(--bg)}
/* docente: segmentado, alumnos listos, filas clicables */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--azul);color:#fff}
.stu.ready{border-color:var(--ok);background:var(--ok-soft)}
.okword{color:var(--ok-ink,var(--ok));font-weight:700}
.stu{cursor:pointer} .grp .nm[role=button]{cursor:pointer} .grp .nm[role=button]:hover span{text-decoration:underline}
.brand .logo{margin-left:auto}

/* ---- tour de Beau ---- */
.tour{padding-top:16px}
.tour-card{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--azul-2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.tour-card canvas{border-radius:14px;flex:none}
.tour-body{flex:1;min-width:0} .tour-body h2{margin:2px 0 6px;font-size:22px;text-wrap:balance} .tour-body p{margin:0;font-size:15.5px;line-height:1.5}
.tour-blocks{display:grid;gap:4px;margin-top:10px}
.tour-blocks .tb{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 8px;border-radius:8px;background:var(--surface-2)}
.tour-blocks .n{width:22px;height:22px;border-radius:6px;background:var(--azul);color:#fff;font-family:var(--f-disp);font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tour-blocks .t{flex:1;min-width:0} .tour-blocks .m{font-family:var(--f-mono);color:var(--ink-3);font-size:12px}
.tour-tabs{display:flex;gap:4px;margin-top:12px;background:var(--surface-3);border-radius:10px 10px 0 0;padding:6px 6px 0}
.tour-tabs .tab{padding:6px 12px;border-radius:8px 8px 0 0;font-size:13px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);border-bottom:0}
.tour-tabs .tab.on{background:var(--surface);color:var(--ink);font-weight:700}
.spot{outline:3px solid var(--rojo)!important;outline-offset:3px;animation:spot 1.2s ease-in-out infinite;position:relative;z-index:31}
@keyframes spot{0%,100%{box-shadow:0 0 0 0 rgba(230,57,70,.45)}50%{box-shadow:0 0 0 10px rgba(230,57,70,0)}}
@media (max-width:480px){ .tour-card{flex-direction:column} .tour-card canvas{width:56px!important;height:64px!important} }
/* ---- Beau en modo alerta (momento decisivo) ---- */
#beau.alert .bub{border:2px solid var(--rojo);box-shadow:0 0 0 4px rgba(230,57,70,.18),var(--shadow);animation:shake .5s ease-in-out 1}
#beau.alert .bav{animation:bounce .6s ease-in-out 2}
#beau.alert .bub .who{color:var(--rojo)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
/* ---- bloque 1 · pivoteo: lluvia, grupos y votación ---- */
.probs{display:flex;flex-direction:column;gap:6px}
.prob{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14.5px;text-align:left;color:var(--ink);font:inherit}
.prob .tx{flex:1;min-width:0}
.prob .mini{border:0;background:transparent;color:var(--ink-3);font-size:13px;cursor:pointer;padding:2px 4px;flex:none}
.prob.sel-able{cursor:pointer} .prob.sel-able:hover{border-color:var(--azul-2)}
.prob.sel-able.on{border-color:var(--azul);background:var(--azul-soft)}
.prob .chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex:none;background:var(--surface)}
.prob.on .chk{background:var(--azul);border-color:var(--azul)}
.pgroup{border:1.5px solid color-mix(in srgb,var(--gc,var(--line)) 60%,transparent);border-radius:var(--r-s);padding:8px;background:color-mix(in srgb,var(--gc,var(--surface)) 6%,var(--surface))}
.pgroup.loose{--gc:var(--ink-3);border-style:dashed}
.pgroup .gh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px}
.pgroup .gh .dot{width:10px;height:10px;border-radius:50%;background:var(--gc);flex:none}
.pgroup .gh small{color:var(--ink-3)}
.pgroup .gh .mini{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:13px;padding:2px 4px}
.prob.vote .star{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);font-size:18px;line-height:1;cursor:pointer;flex:none;color:var(--ink-3)}
.prob.vote .star.on{background:var(--gold);border-color:var(--gold);color:#3D2A14}
.prob.vote.chosen{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface));font-weight:700}
.prob.vote.runner{border-style:dashed}
.prob.vote .st{font-size:10.5px;background:var(--surface-3);border-radius:999px;padding:2px 7px;margin-left:6px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.vote-head{display:flex;gap:12px;align-items:center;background:var(--rojo-soft);border:1.5px solid var(--rojo);border-radius:var(--r-s);padding:10px 12px}
.vote-head h3{font-size:17px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:color-mix(in srgb,var(--rojo) 25%,transparent)}
.ring .fg{stroke:var(--rojo);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:20px;color:var(--rojo-ink)}
.ring.warn .fg{stroke:var(--warn)} .ring.warn b{color:var(--warn)}
.ring.over .fg{stroke:var(--ink-3)} .ring.over b{color:var(--ink-3);font-size:14px}
/* ---- bloque 7 · lo que me faltó ---- */
.falta{border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 12px;background:var(--surface)}
.falta.supongo{border-color:var(--warn);background:var(--warn-soft)}
.falta.dato{border-color:var(--ok)} .falta.vi{border-color:var(--azul-2)}
.falta .fh{display:flex;gap:8px;align-items:baseline;margin-bottom:8px;font-size:15px}
.falta .side{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--surface-3);color:var(--ink-2);flex:none}
.falta .side.c{background:#F1E4D0;color:#3D2A14} .falta .side.e{background:var(--ok-soft);color:var(--ok)}
/* ---- post-its (tablero tipo Miro) ---- */
.board{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}

  function make(i){ const z=rnd(0.18,1); return {x:rnd(0,1), y:rnd(0,1), z, r:(rnd(36,120)*z+22)*(mobile?0.8:1), col:COLS[i%COLS.length], vx:rnd(-1,1)*0.012*z, vy:rnd(-1,1)*0.009*z, ph:rnd(0,Math.PI*2), ph2:rnd(0,Math.PI*2), sp:rnd(0.15,0.45)}; }

    const bgG=ctx.createLinearGradient(0,0,0,H); if(dark){ bgG.addColorStop(0,'rgba(24,36,80,.55)'); bgG.addColorStop(1,'rgba(8,14,32,0)'); } else { bgG.addColorStop(0,'rgba(212,224,255,.55)'); bgG.addColorStop(1,'rgba(255,255,255,0)'); }

/* ============ SINCRONÍA: Firebase Realtime Database (con sesión anónima), o modo demo local ============ */
const Sync=(function(){
  const api={mode:'demo', code:'S7', offset:0, ready:false, uid:null};
  let db=null;
  const demoKey=(k)=>'tl_'+api.code+'_'+k;
  function lsGet(k){ try{ const v=localStorage.getItem(k); return v? JSON.parse(v):null; }catch(e){ return null; } }
  function lsSet(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  const base=()=>'sessions/'+api.code;
  const isAdmin=()=>api.mode!=='firebase' || true;
  /* init devuelve una promesa: en Firebase espera la sesión anónima */
  api.init=function(opts){
    api.code=(opts.code||'S7').replace(/[^A-Za-z0-9_-]/g,'').slice(0,24)||'S7';
    const cfg=opts.config;
    if(cfg && cfg.apiKey && !/PEGA|TU_|xxxx/i.test(cfg.apiKey) && cfg.databaseURL && typeof firebase!=='undefined'){
      try{ if(!firebase.apps.length) firebase.initializeApp(cfg); db=firebase.database(); api.mode='firebase'; db.ref('.info/serverTimeOffset').on('value', s=>{ api.offset=s.val()||0; }); }
      catch(e){ console.error('Firebase no disponible, modo demo', e); db=null; api.mode='demo'; }
    } else api.mode='demo';
    if(db){ return new Promise((res)=>{ let done=false; const finish=(u)=>{ if(done) return; done=true; api.uid=u; api.ready=true; res(api.mode); };
        firebase.auth().onAuthStateChanged(u=>{ if(u) finish(u.uid); });
        firebase.auth().signInAnonymously().catch(e=>{ console.error('Sesión anónima rechazada (¿está habilitada en Firebase?)', e); api.authError=e; finish(null); });
        setTimeout(()=>finish(api.uid), 8000); }); }
    api.ready=true; api.uid='demo'; return Promise.resolve(api.mode);
  };
  api.now=()=>Date.now()+api.offset;
  /* --- estado de la sesión (lo escribe el docente) --- */
  api.onState=function(cb){
    if(db){ db.ref(base()+'/state').on('value', s=>cb(s.val()||null), e=>{ console.error(e); api.lastError=e; cb(null); }); return; }
    let last='__'; const tick=()=>{ const v=lsGet(demoKey('state')); const j=JSON.stringify(v); if(j!==last){ last=j; cb(v); } };
    tick(); setInterval(tick, 600); window.addEventListener('storage', tick);
  };
  api.readState=async function(){ if(db){ const s=await db.ref(base()+'/state').once('value'); return s.val(); } return lsGet(demoKey('state')); };
  api.setState=function(state){ if(db){ return db.ref(base()+'/state').set(state); } lsSet(demoKey('state'), state); return Promise.resolve(); };
  /* --- docente: crear la sesión o entrar con el PIN --- */
  api.teacherLogin=async function(pin){
    pin=String(pin||'').trim();
    if(!db){ const saved=lsGet(demoKey('pin')); if(saved && saved!==pin) return {ok:false, error:'pin'}; if(!saved){ lsSet(demoKey('pin'), pin); if(!lsGet(demoKey('state'))) lsSet(demoKey('state'), {block:0, phase:'idle', createdAt:Date.now()}); return {ok:true, created:true}; } return {ok:true}; }
    if(!api.uid) return {ok:false, error:'auth'};
    const ref=db.ref(base()); let owner=null;
    try{ const s=await ref.child('owner').once('value'); owner=s.val(); }catch(e){ return {ok:false, error:'read', detail:e.message}; }
    if(!owner){ try{ await ref.update({owner:api.uid, pin, state:{block:0, phase:'idle', createdAt:api.now()}}); return {ok:true, created:true}; }catch(e){ return {ok:false, error:'create', detail:e.message}; } }
    if(owner===api.uid) return {ok:true, owner:true};
    try{ await ref.child('admins/'+api.uid).set({pin, at:api.now()}); return {ok:true}; }catch(e){ return {ok:false, error:'pin', detail:e.message}; }

      const label= k===NBLK? k+' · META' : String(k); const lb2=bshort(k,via); ctx.textAlign='center'; ctx.font='800 '+fs.toFixed(1)+'px system-ui,sans-serif'; const w1=ctx.measureText(label).width; ctx.font='700 '+fs2.toFixed(1)+'px system-ui,sans-serif'; const w2=ctx.measureText(lb2).width; const tw=Math.max(w1,w2)+16; ctx.fillStyle= cur? '#E63946' : (dark? 'rgba(20,30,51,.85)':'rgba(255,255,255,.92)'); roundRect(ctx, f.x-tw/2, f.y-64-fs-fs2-14, tw, fs+fs2+10, 8); ctx.fill(); ctx.fillStyle= cur? '#fff' : (dark? '#EEF2FA':'#141E33'); ctx.font='800 '+fs.toFixed(1)+'px system-ui,sans-serif'; ctx.fillText(label, f.x, f.y-64-fs2-8); ctx.font='700 '+fs2.toFixed(1)+'px system-ui,sans-serif'; ctx.fillStyle= cur? 'rgba(255,255,255,.9)' : (dark? 'rgba(238,242,250,.85)':'rgba(20,30,51,.8)'); ctx.fillText(lb2, f.x, f.y-64-4); });
  }
  function draw(){ const ctx=H.ctx, W=H.W, Hh=H.Hh; const dark=isDark(); const blk=ST?(ST.block||0):0; const ended=ST&&ST.phase==='ended'; const c=H.cam; const z=c.z; const now=Sync.now();
    ctx.setTransform(H.dpr,0,0,H.dpr,0,0); ctx.fillStyle= dark? '#0E1730':'#EAF2FF'; ctx.fillRect(0,0,W,Hh);
    ctx.setTransform(H.dpr*z,0,0,H.dpr*z, H.dpr*(W/2-c.cx*z), H.dpr*(Hh/2-c.cy*z));
    drawWorld(dark, blk, ended);
    const list=agentsOnMap(); const {sh, sw, wh, ww}=spriteSize(); const lf=Math.max(11.5, 13/z); const bf=Math.max(11.5, 13/z);
    list.forEach(a=>{ const frame= a.moving? 1+Math.floor(a.walk)%3 : 0; const sp=sprite(a.avatar, frame, Math.round(sh/4)*4); const bob= a.moving? Math.abs(Math.sin(a.walk*1.5))*2/z : 0; const dim= !a.online; ctx.globalAlpha= dim? 0.55 : 1;
      ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(a.x, a.y+2/z, ww*0.26, ww*0.09, 0,0,Math.PI*2); ctx.fill();
      if(a.hand){ const pulse=0.5+0.5*Math.sin(H.t*5); ctx.strokeStyle='rgba(245,196,0,'+(0.5+0.4*pulse).toFixed(2)+')'; ctx.lineWidth=4/z; ctx.beginPath(); ctx.ellipse(a.x, a.y+2/z, ww*0.4+6/z*pulse, ww*0.16+3/z*pulse, 0,0,Math.PI*2); ctx.stroke(); }
      else if(a.behind){ ctx.strokeStyle='rgba(230,120,30,.75)'; ctx.lineWidth=3/z; ctx.setLineDash([6/z,5/z]); ctx.beginPath(); ctx.ellipse(a.x, a.y+2/z, ww*0.36, ww*0.14, 0,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]); }
      ctx.drawImage(sp, a.x-ww/2, a.y-wh-bob, ww, wh);
      /* nombre */
      const label=(a.name||'').split(' ')[0].slice(0,14); ctx.font='700 '+lf.toFixed(1)+'px system-ui,sans-serif'; const tw=ctx.measureText(label).width+12/z; const lh=lf+6/z; const ly=a.y-wh-bob-lh-3/z; ctx.fillStyle= a.done? '#F5C400' : a.hand? '#F5C400' : a.doneNow? '#2E8B57' : a.behind? '#E8862A' : (dark? 'rgba(20,30,51,.88)' : 'rgba(255,255,255,.95)'); roundRect(ctx, a.x-tw/2, ly, tw, lh, 6/z); ctx.fill(); ctx.fillStyle= (a.done||a.hand)? '#3D2A14' : (a.doneNow||a.behind)? '#fff' : (dark? '#EEF2FA' : '#141E33'); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label, a.x, ly+lh/2); ctx.textBaseline='alphabetic';
      /* frase */
      if(a.phrase && a.phrase.t){ ctx.font='600 '+bf.toFixed(1)+'px system-ui,sans-serif'; const txt=a.phrase.t.length>34? a.phrase.t.slice(0,33)+'…' : a.phrase.t; const bw=ctx.measureText(txt).width+16/z; const bh=bf+10/z; const by=ly-bh-6/z; ctx.fillStyle= a.hand? '#F5C400' : (dark? 'rgba(238,242,250,.96)' : 'rgba(255,255,255,.98)'); ctx.strokeStyle= a.hand? '#B8860B' : (dark? 'rgba(0,0,0,.2)':'rgba(20,30,51,.18)'); ctx.lineWidth=1.5/z; roundRect(ctx, a.x-bw/2, by, bw, bh, 8/z); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(a.x-5/z, by+bh); ctx.lineTo(a.x, by+bh+6/z); ctx.lineTo(a.x+5/z, by+bh); ctx.closePath(); ctx.fill(); ctx.fillStyle= a.hand? '#3D2A14' : '#141E33'; ctx.textBaseline='middle'; ctx.fillText(txt, a.x, by+bh/2); ctx.textBaseline='alphabetic'; }
      /* reacción flotante */
      if(a.react && now-a.react.at<7000){ const k=(now-a.react.at)/7000; ctx.globalAlpha=(1-k)*(dim?0.55:1); ctx.font=(Math.max(22, 26/z)).toFixed(1)+'px system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillText(a.react.e, a.x+ww*0.55, a.y-wh-bob-k*70/z); }
      ctx.globalAlpha=1; });
    drawSigns(dark, blk);
    ctx.setTransform(H.dpr,0,0,H.dpr,0,0);
    if(!list.length){ ctx.fillStyle= dark? 'rgba(238,242,250,.85)':'rgba(20,30,51,.75)'; ctx.font='600 16px system-ui,sans-serif'; ctx.textAlign='center'; const other=Object.values(H.agents).length; ctx.fillText(other? 'En esta vía todavía no hay alumnos; cambia de mapa arriba.' : 'Cuando los alumnos entren, aparecen aquí y recorren el mapa a medida que avanzan.', W/2, Hh*0.5); }
  }
  return H;
})();
(function boot(){ const params=new URLSearchParams(location.search); if(params.get('s')) T.code=params.get('s'); if(loadT() && T.pin){ renderLogin(); login(); } else renderLogin(); setInterval(tick, 500); setInterval(()=>{ if(T.logged){ renderRoster(); renderMetrics(); renderProjHUD(); } }, 15000); })();

</script>
